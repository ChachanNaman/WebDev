<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- heading
        user
        stats -->

        <h1>LEET METRICS</h1>
        <div class="user-container">

            <p>Enter your username below : </p>

            <div class="user-input-container">
                <input type="text" placeholder="Enter your username here" id="user-input">
                <button id="search-btn">Search</button>
            </div>
        </div>

        <div class="stats-container"> 
            <!-- contains the stats section
                then it contains the progress section which have three items easy , medium , hard divs and in those divs there span  -->
            <div class="progress">

                <div class="progress-item circle">
                    <div class="easy-progress">
                        <span id="easy-label"></span>
                        Easy
                    </div>
                </div>

                <div class="progress-item circle">
                    <div class="medium-progress">
                        <span id="medium-label"></span>
                        Medium
                    </div>
                </div>

                <div class="progress-item circle">
                    <div class="hard-progress">
                        <span id="hard-label"></span>
                        Hard
                    </div>
                </div>

                <div class="stats-cards">
                    <!-- directly populate card here from JS code -->
                </div>
            </div>

        </div>

    <script src="script.js"></script>
</body>
</html>
